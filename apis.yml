apis:
- aid: instructure:canvas-graphql-api
  name: Canvas GraphQL API
  description: >-
    The Canvas GraphQL API provides a flexible query interface for Canvas LMS data, allowing developers
    to request exactly the fields they need and reduce over-fetching. It follows the Relay Object Identification
    spec and includes an interactive GraphiQL browser accessible by appending /graphiql to the Canvas
    production URL.
  humanURL: https://developerdocs.instructure.com/services/canvas/basics/file.graphql
  baseURL: https://{canvas_domain}/api/graphql
  tags:
  - GraphQL
  - Courses
  - Users
  - Assignments
  - Grades
  properties:
  - type: Documentation
    url: https://developerdocs.instructure.com/services/canvas/basics/file.graphql
  - url: graphql/instructure-schema.graphql
    type: GraphQLSchema
  - url: graphql/instructure-graphql.md
    type: GraphQL
- aid: instructure:data-access-platform-api
  name: Data Access Platform (DAP) API
  description: >-
    The Instructure Data Access Platform API provides bulk data query capabilities for Canvas data, enabling
    institutions and developers to access large datasets for analytics, reporting, and data warehousing.
    It includes table listing, schema inspection, and data query endpoints with distinct rate limits per
    operation type.
  humanURL: https://developerdocs.instructure.com/services/dap
  baseURL: https://api-gateway.instructure.com/dap
  tags:
  - Data
  - Analytics
  - Bulk Data
  - Reporting
  properties:
  - type: Documentation
    url: https://developerdocs.instructure.com/services/dap
  - type: RateLimits
    url: https://developerdocs.instructure.com/services/dap/limits-policies
  contact:
  - FN: DAP Support
    email: canvasdatahelp@instructure.com
- aid: instructure:canvas-studio-api
  name: Canvas Studio API
  description: >-
    The Canvas Studio API provides programmatic access to Canvas Studio, Instructure's video and media
    platform, enabling account administrators and developers to manage media assets, captions, analytics,
    and user data within the Studio product.
  humanURL: https://github.com/instructure/canvas-studio-api-examples
  baseURL: https://{studio_domain}/api
  tags:
  - Studio
