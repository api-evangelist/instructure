aid: instructure
name: Instructure
description: Instructure is an EdTech company best known for Canvas LMS, a widely
  adopted learning management system used by thousands of educational institutions
  and organizations worldwide. The platform provides a comprehensive REST API and
  GraphQL API enabling developers to programmatically access and manage courses, enrollments,
  assignments, grades, discussions, and institutional data. Instructure also offers
  the Data Access Platform (DAP) for bulk data queries, New Quizzes API, Canvas Studio
  API, and support for LTI 1.3 integrations. Authentication is handled via OAuth2
  with per-token dynamic rate limiting, and all API responses are returned in JSON
  over HTTPS.
type: Index
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
url: https://raw.githubusercontent.com/api-evangelist/instructure/refs/heads/main/apis.yml
