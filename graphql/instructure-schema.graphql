"""Relay-style pagination connection for Accounts"""
type AccountConnection {
  nodes: [Account!]
  edges: [AccountEdge!]
  pageInfo: PageInfo!
}
type AccountEdge { node: Account; cursor: String! }

"""Relay-style pagination connection for Courses"""
type CourseConnection {
  nodes: [Course!]
  edges: [CourseEdge!]
  pageInfo: PageInfo!
}
type CourseEdge { node: Course; cursor: String! }

"""Relay-style pagination connection for Users"""
type UserConnection {
  nodes: [User!]
