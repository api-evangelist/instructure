"""
Canvas LMS GraphQL API Schema
Source: https://github.com/instructure/canvas-lms/tree/master/app/graphql
Endpoint: https://{canvas_domain}/api/graphql
"""

interface Node {
  id: ID!
}

interface Timestamps {
  createdAt: DateTime
  updatedAt: DateTime
}

interface LegacyNode {
  _id: ID!
}

scalar DateTime
scalar URL
scalar ISO8601Duration

enum CourseWorkflowState {
  created
  claimed
  available
  completed
  deleted
}

enum EnrollmentWorkflowState {
  invited
  creation_pending
  active
  rejected
  completed
  inactive
}

enum EnrollmentType {
  StudentEnrollment
  TeacherEnrollment
  TaEnrollment
  ObserverEnrollment
  DesignerEnrollment
  StudentViewEnrollment
}

enum GradingType {
  pass_fail
  percent
  letter_grade
  gpa_scale
  points
  not_graded
}

enum AssignmentState {
  published
  unpublished
  deleted
}

enum DiscussionFilterType {
  all
  unread
  deleted
}

enum DiscussionTopicAnonymousStateType {
  off
  partial_anonymity
  full_anonymity
}

enum GroupStateType {
  available
  closed
  deleted
}

enum OrderDirection {
  ascending
  descending
}

type Query {
  node(id: ID!): Node
  legacyNode(type: String!, _id: ID!): Node
  account(id: ID, sisId: String): Account
  user(id: ID!): User
  course(id: ID, sisId: String): Course
  assignment(id: ID, sisId: String): Assignment
  rubric(id: ID!): Rubric
  folder(id: ID!): Folder
  myInboxSettings: InboxSettings
  institutionalTag(id: ID!): InstitutionalTag
  institutionalTagCategory(id: ID!): InstitutionalTagCategory
  internalSetting(id: ID, name: String): InternalSetting
  internalSettings: [InternalSetting!]
  accountNotifications(accountId: ID): [AccountNotification!]!
  enrollmentInvitations(includeEnrollmentUuid: String): [Enrollment!]!
}

type Account implements Node & LegacyNode & Timestamps {
  id: ID!
  _id: ID!
  createdAt: DateTime
  updatedAt: DateTime
  name: String
  workflowState: String!
  sisId: String
  outcomeProficiency: OutcomeProficiency
  outcomeCalculationMethod: OutcomeCalculationMethod
  coursesConnection(after: String, first: Int, before: String, last: Int): CourseConnection
  customGradeStatusesConnection(after: String, first: Int, before: String, last: Int): CustomGradeStatusConnection
  standardGradeStatusesConnection(after: String, first: Int, before: String, last: Int): StandardGradeStatusConnection
  subAccountsConnection(after: String, first: Int, before: String, last: Int): AccountConnection
  parentAccountsConnection(after: String, first: Int, before: String, last: Int): AccountConnection!
  usersConnection(after: String, first: Int, before: String, last: Int): UserConnection
  rubricConnection(after: String, first: Int, before: String, last: Int): RubricConnection
  rootOutcomeGroup: LearningOutcomeGroup!
}

type Course implements Node & LegacyNode & Timestamps {
  id: ID!
  _id: ID!
  createdAt: DateTime
  updatedAt: DateTime
  name: String!
  courseCode: String
  state: CourseWorkflowState!
  syllabusBody: String
  sisId: String
  horizonCourse: Boolean
  applyGroupWeights: Boolean
  allowFinalGradeOverride: Boolean
  imageUrl: URL
  term: Term
  account: Account
  permissions: CoursePermissions
  postPolicy: PostPolicy
  settings: CourseSettings
  gradeStatuses: [String!]!
  assignmentGroupsConnection(after: String, first: Int, before: String, last: Int): AssignmentGroupConnection!
  assignmentsConnection(filter: AssignmentFilter, after: String, first: Int, before: String, last: Int): AssignmentConnection
  submissionsConnection(studentIds: [ID!], orderBy: [SubmissionOrderCriteria!], filter: SubmissionFilterInput, after: String, first: Int, before: String, last: Int): SubmissionConnection
  sectionsConnection(filter: CourseSectionsFilter, after: String, first: Int, before: String, last: Int): SectionConnection!
  modulesConnection(filter: ModuleFilterInput, after: String, first: Int, before: String, last: Int): ModuleConnection
  groupsConnection(includeNonCollaborative: Boolean, after: String, first: Int, before: String, last: Int): GroupConnection
  groupSetsConnection(includeNonCollaborative: Boolean, after: String, first: Int, before: String, last: Int): GroupSetConnection
  usersConnection(userIds: [ID!], filter: CourseUsersFilter, sort: CourseUsersSortInput, after: String, first: Int, before: String, last: Int): UserConnection
  enrollmentsConnection(filter: EnrollmentFilterInput, after: String, first: Int, before: String, last: Int): EnrollmentConnection
  gradingPeriodsConnection(after: String, first: Int, before: String, last: Int): GradingPeriodConnection!
  rubricConnection(id: ID, after: String, first: Int, before: String, last: Int): RubricConnection
  foldersConnection(after: String, first: Int, before: String, last: Int): FolderConnection
  discussionsConnection(filter: DiscussionFilter, after: String, first: Int, before: String, last: Int): DiscussionConnection
  filesConnection(filter: FileFilter, after: String, first: Int, before: String, last: Int): FileConnection
  pagesConnection(filter: PageFilter, after: String, first: Int, before: String, last: Int): PageConnection
  quizzesConnection(filter: QuizFilter, after: String, first: Int, before: String, last: Int): QuizConnection
  submissionStatistics(observedUserId: ID): SubmissionStatistics
  moduleProgressionStatistics: ModuleProgressionStatistics
  gradingStandard: GradingStandard
  relevantGradingPeriodGroup: GradingPeriodGroup
  rootOutcomeGroup: LearningOutcomeGroup!
  outcomeAlignmentStats: CourseOutcomeAlignmentStats
  dashboardCard: CourseDashboardCard
  activityStream: ActivityStream
}

type User implements Node & LegacyNode & Timestamps {
  id: ID!
  _id: ID!
  createdAt: DateTime
  updatedAt: DateTime
  name: String
  firstName: String
  lastName: String
  shortName: String
  sortableName: String
  pronouns: String
  email: String
  avatarUrl: URL
  htmlUrl: URL
  uuid: String
  sisId: String
  integrationId: String
  loginId: String
  discussionsSplitscreenView: Boolean!
  inboxLabels: [String!]
  enrollments(courseId: ID, currentOnly: Boolean): [Enrollment!]!
  enrollmentsConnection(filter: EnrollmentFilterInput, after: String, first: Int, before: String, last: Int): EnrollmentConnection
  groups: [Group!]
  groupMemberships: [GroupMembership!]!
  notificationPreferences: NotificationPreferences
  notificationPreferencesEnabled(accountId: ID!, type: String!): Boolean!
  conversationsConnection(after: String, first: Int, before: String, last: Int): ConversationParticipantConnection
  summaryAnalytics(courseId: ID!): StudentSummaryAnalytics
  courseWorkSubmissionsConnection(courseId: ID, after: String, first: Int, before: String, last: Int): SubmissionConnection
  commentBankItemsConnection(query: String, after: String, first: Int, before: String, last: Int): CommentBankItemConnection
  courseRoles(courseId: ID, roleTypes: [String!]): [String!]
  courseProgression(courseId: ID!): CourseProgression
  activityStream: ActivityStream
}

type Assignment implements Node & LegacyNode & Timestamps {
