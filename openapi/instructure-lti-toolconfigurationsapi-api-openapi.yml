openapi: 3.0.3
info:
  title: Canvas LMS LTI ExternalTool Lti::ToolConfigurationsApi API
  description: Canvas LTI 1.3 API endpoints including Dynamic Registration, IMS Names and Roles, Line Items, Data Services, and Security endpoints.
  version: 1.0.0
  contact:
    name: Instructure Support
    url: https://developerdocs.instructure.com/
    email: support@instructure.com
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://{canvas_domain}
  description: Canvas institution domain
  variables:
    canvas_domain:
      default: canvas.instructure.com
      description: The institution-specific Canvas domain
tags:
- name: Lti::ToolConfigurationsApi
paths:
  /api/lti/accounts/{account_id}/developer_keys/tool_configuration:
    post:
      summary: create
      tags:
      - Lti::ToolConfigurationsApi
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: integer
        example: 8095
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                developer_key:
                  type: object
                  properties:
                    email:
                      type: string
                    name:
                      type: string
                    notes:
                      type: string
                    public_jwk_url:
                      type: string
                    redirect_uris:
                      type: string
                    require_scopes:
                      type: string
                    scopes:
                      type: array
                      items:
                        type: string
                    test_cluster_only:
                      type: string
                  required:
                  - email
                  - name
                  - notes
                  - public_jwk_url
                  - require_scopes
                  - scopes
                  - test_cluster_only
                developer_key_id:
                  type: string
                tool_configuration:
                  type: object
                  properties:
                    privacy_level:
                      type: string
                    settings:
                      type: object
                      properties:
                        custom_fields:
                          type: object
                          properties:
                            has_expansion:
