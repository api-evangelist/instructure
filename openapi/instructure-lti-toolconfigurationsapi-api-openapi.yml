                          items:
                            type: object
                            properties:
                              platform:
                                type: string
                              privacy_level:
                                type: string
                              tool_id:
                                type: string
                              domain:
                                type: string
                              settings:
                                type: object
                                properties:
                                  icon_url:
                                    type: string
                                  selection_height:
                                    type: string
                                  selection_width:
                                    type: string
                                  text:
                                    type: string
                                  placements:
                                    type: array
                                    items:
                                      type: object
                                      properties:
                                        placement:
                                          type: string
                                        message_type:
                                          type: string
                                        canvas_icon_class:
                                          type: string
                                        icon_url:
                                          type: string
                                        text:
                                          type: string
                                        target_link_uri:
                                          type: string
                                        enabled:
                                          type: string
                                      required:
                                      - placement
                                      - message_type
                                      - canvas_icon_class
                                      - icon_url
                                      - text
                                      - target_link_uri
                                      - enabled
                                required:
                                - icon_url
                                - selection_height
                                - selection_width
                                - text
                                - placements
                            required:
                            - platform
                            - privacy_level
                            - tool_id
                            - domain
                            - settings
                        oidc_initiation_url:
                          type: string
                        public_jwk:
                          type: object
                          properties:
                            alg:
                              type: string
                            e:
                              type: string
                            kid:
                              type: string
                            kty:
                              type: string
                            n:
                              type: string
                            use:
                              type: string
                          required:
                          - alg
                          - e
                          - kid
                          - kty
                          - n
                          - use
                        target_link_uri:
                          type: string
                        title:
                          type: string
                        public_jwk_url:
                          type: string
                      required:
                      - custom_fields
                      - description
                      - extensions
                      - oidc_initiation_url
                      - public_jwk
                      - target_link_uri
                      - title
                    custom_fields:
                      type: string
                    disabled_placements:
                      type: array
                      items:
                        type: string
                    settings_url:
                      type: string
                  required:
                  - privacy_level
              required:
              - developer_key
              - tool_configuration
            example:
              developer_key:
                email: test@test.com
                name: Test Dev Key
                notes: Some cool notes
                public_jwk_url: https://www.test.com
                redirect_uris: "http://www.test.com\r\nhttp://www.anothertest.com"
                require_scopes: 'true'
                scopes:
                - https://purl.imsglobal.org/spec/lti-ags/scope/lineitem
                test_cluster_only: 'true'
              developer_key_id: '142196'
              tool_configuration:
                privacy_level: public
                settings:
                  custom_fields:
                    has_expansion: $Canvas.user.id
                    no_expansion: foo
                  description: 1.3 Tool
                  extensions:
                  - platform: canvas.instructure.com
                    privacy_level: public
                    tool_id: LTI 1.3 Test Tool
                    domain: http://lti13testtool.docker
                    settings:
                      icon_url: https://static.thenounproject.com/png/131630-200.png
                      selection_height: '500'
                      selection_width: '500'
                      text: LTI 1.3 Test Tool Extension text
                      placements:
                      - placement: course_navigation
                        message_type: LtiResourceLinkRequest
                        canvas_icon_class: icon-pdf
                        icon_url: https://static.thenounproject.com/png/131630-211.png
                        text: LTI 1.3 Test Tool Course Navigation
                        target_link_uri: http://lti13testtool.docker/launch?placement=course_navigation
