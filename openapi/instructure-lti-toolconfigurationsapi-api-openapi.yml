        '401':
          description: is expected to be unauthorized
          content:
            text/html:
              schema:
                type: string
              example: ''
        '400':
          description: returns a 400
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                      required:
                      - message
                required:
                - errors
              example:
                errors:
                - message: redirect_uris is missing
        '422':
          description: is expected to be present
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                        message:
                          type: string
                        error_code:
                          nullable: true
                      required:
                      - field
                      - message
                      - error_code
                required:
                - errors
