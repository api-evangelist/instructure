        in: query
        required: false
        schema:
          type: integer
        example: 50
      - name: tag
        in: query
        required: false
        schema:
          type: string
        example: some_tag
      - name: resource_id
        in: query
        required: false
        schema:
          type: string
        example: orig-123
      responses:
        '401':
          description: returns 401 unauthorized and complains about missing tool
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: object
                    properties:
                      type:
                        type: string
                      message:
                        type: string
                    required:
                    - type
                    - message
                required:
                - errors
              example:
                errors:
                  type: unauthorized
                  message: Access Token not linked to a Tool associated with this
                    Context
        '201':
          description: properly formats the response
          content:
            application/vnd.ims.lis.v2.lineitem+json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  scoreMaximum:
                    type: number
                    format: float
                  label:
                    type: string
                  resourceId:
                    type: string
                  tag:
                    type: string
                  endDateTime:
                    type: string
                  https://canvas.instructure.com/lti/submission_type:
                    type: object
                    properties:
                      type:
                        type: string
                      external_tool_url:
                        type: string
                    required:
                    - type
                    - external_tool_url
                  resourceLinkId:
                    type: string
                required:
                - id
                - scoreMaximum
                - label
                - resourceId
                - tag
                - endDateTime
                - resourceLinkId
                - https://canvas.instructure.com/lti/submission_type
              example:
                id: http://test.host/api/lti/courses/880189/line_items/1017691
                scoreMaximum: 50.0
                label: Originality Score
                resourceId: orig-123
                tag: some_tag
                endDateTime: '2023-12-15T05:40:07Z'
                https://canvas.instructure.com/lti/submission_type:
                  type: external_tool
                  external_tool_url: http://www.google.com
                resourceLinkId: 57427bfe-cb04-412a-9d7c-171bc8111073
