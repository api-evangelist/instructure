openapi: 3.0.3
info:
  title: Canvas LMS LTI ExternalTool API
  description: Canvas LTI 1.3 API endpoints including Dynamic Registration, IMS Names and Roles, Line Items, Data Services, and Security endpoints.
  version: 1.0.0
  contact:
    name: Instructure Support
    url: https://developerdocs.instructure.com/
    email: support@instructure.com
  license:
    name: AGPL-3.0
    url: https://github.com/instructure/canvas-lms/blob/master/LICENSE
servers:
- url: https://{canvas_domain}
  description: Canvas institution domain
  variables:
    canvas_domain:
      default: canvas.instructure.com
      description: The institution-specific Canvas domain
tags:
- name: ExternalTool
paths:
  /api/lti/courses/{course_id}/jwt_token:
    get:
      summary: jwt_token
      tags:
      - ExternalTool
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: integer
        example: 880104
      - name: tool_id
        in: query
        required: false
        schema:
          type: integer
        example: 407124
      - name: tool_launch_url
        in: query
        required: false
        schema:
          type: string
        example: http://www.example.com/basic_lti
      responses:
        '404':
          description: sets status code to 404 if the requested tool id does not exist
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        message:
                          type: string
                      required:
                      - message
                required:
                - errors
              example:
                errors:
                - message: The specified resource does not exist.
        '200':
          description: returns the correct JWT token when given using the tool_id param
          content:
            application/json:
              schema:
                type: object
                properties:
                  jwt_token:
                    type: string
                required:
                - jwt_token
              example:
                jwt_token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..DuT4WnFME5owv8totVjlU307cYsW6zohT81lZt38GS0
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth 2.0 authentication
      flows:
        authorizationCode:
          authorizationUrl: https://{canvas_domain}/login/oauth2/auth
          tokenUrl: https://{canvas_domain}/login/oauth2/token
          scopes: {}
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token (access token)
